<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>.dot blog — новини без зайвого</title>
<meta name="description" content="Новинний блог .dot blog: коротко, чітко і по суті.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><circle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23FF4D6D%27/></svg>">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}document.documentElement.classList.add("js")</script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html" aria-label=".dot blog — на головну"><span class="pt">.</span>dot blog</a>
  <div class="bar">
    <a class="navlink" href="index.html#feed-top">Стрічка</a>
    <button id="theme" class="theme" type="button" aria-label="Змінити тему">
      <svg class="ic sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div></div></header>
<main>
  <section class="hero">
    <canvas id="dots" aria-hidden="true"></canvas>
    <div class="wrap">
      <h1><span class="w" style="--i:0">Новини</span> <span class="w" style="--i:1">без</span> <span class="w" style="--i:2">зайвого</span><span class="big-dot">.</span></h1>
      <p class="lead">Коротко, чітко і по суті. Читайте свіжі матеріали про технології, дизайн і життя навколо нас.</p>
      <a class="btn" href="#feed-top"><i></i><span>Читати стрічку</span></a>
    </div>
  </section>

  <section class="wrap" id="feed-top" style="scroll-margin-top:90px">
    <div class="feed-head">
      <div><h2>Стрічка</h2><p id="count" aria-live="polite"></p></div>
      <div class="tools">
        <div class="chips" id="chips" role="group" aria-label="Рубрики"></div>
        <input class="search" id="search" type="search" placeholder="Пошук за назвою" aria-label="Пошук статей">
      </div>
    </div>
    <div class="grid" id="feed"></div>
  </section>
</main>
<footer class="foot"><div class="wrap">
  <span>© <span id="year">2026</span> .dot blog. Усі права захищено.</span>
  <span class="made">Сайт створив <b>Shershnov Yehor</b></span>
</div></footer>
<script src="js/main.js"></script>
</body>
</html>
